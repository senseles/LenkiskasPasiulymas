<html lang="pl">
<head>
<meta charset="UTF-8" />

<title>Wilno – Przewodnik dla Gości z Polski</title>
<style>
  :root {
    --bg: #faf7f2;
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #b8312f;
    --accent-2: #d4a373;
    --accent-3: #2f6b3c;
    --accent-4: #6b4ba0;
    --card: #ffffff;
    --border: #e8e2d5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
  }
  header {
    padding: 32px 24px 16px;
    text-align: center;
    background: linear-gradient(180deg, #fff 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0 0 8px;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 1.05rem;
  }
  .flag { display: inline-block; margin-right: 6px; }
  main {
    max-width: 820px;
    margin: 0 auto;
    padding: 24px;
  }
  h2 {
    margin: 0 0 12px;
    font-size: 1.3rem;
  }
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  .chip {
    padding: 6px 14px;
    border-radius: 999px;
    background: #fff;
    border: 1px solid var(--border);
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.15s;
    font-family: inherit;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .section-title {
    font-size: 1rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 24px 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .section-title:first-of-type { margin-top: 0; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 12px;
    transition: all 0.2s;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: block;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    border-color: var(--accent);
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 6px;
  }
  .card-head h3 { margin: 0; font-size: 1.1rem; }
  .rating {
    color: var(--accent);
    font-weight: 600;
    font-size: 0.9rem;
    white-space: nowrap;
  }
  .cat {
    display: inline-block;
    font-size: 0.72rem;
    color: #fff;
    padding: 2px 8px;
    border-radius: 4px;
    margin-right: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .cat.restaurant { background: var(--accent-2); }
  .cat.bar { background: var(--accent-4); }
  .cat.sight { background: var(--accent-3); }
  .cat.premium { background: var(--accent); }
  .price {
    display: inline-block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-left: 4px;
  }
  .desc {
    font-size: 0.92rem;
    color: #333;
    margin: 8px 0 10px;
  }
  .pl-note {
    font-size: 0.82rem;
    color: var(--accent);
    background: #fff4f3;
    padding: 6px 10px;
    border-radius: 6px;
    margin-top: 8px;
    border-left: 3px solid var(--accent);
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 6px 12px;
    font-size: 0.82rem;
    border-radius: 6px;
    text-decoration: none;
    border: 1px solid var(--border);
    color: var(--ink);
    background: #fff;
    transition: all 0.15s;
  }
  .btn:hover {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn-primary:hover {
    background: #8f2422;
    border-color: #8f2422;
  }
  .btn-tablein {
    background: #2563eb;
    color: #fff;
    border-color: #2563eb;
  }
  .btn-tablein:hover {
    background: #1d4ed8;
    border-color: #1d4ed8;
  }
  .map-hint {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 6px;
  }
  footer {
    text-align: center;
    padding: 24px;
    color: var(--muted);
    font-size: 0.85rem;
    border-top: 1px solid var(--border);
    margin-top: 24px;
  }
</style>
</head>

const catLabels = {
  restaurant: 'Restauracje',
  premium: 'Premium / Fine dining',
  bar: 'Bary i puby',
  sight: 'Atrakcje i miejsca warte odwiedzenia'
};

function render() {
  const container = document.getElementById('cards');
  container.innerHTML = '';

  const order = ['restaurant', 'premium', 'bar', 'sight'];
  order.forEach(catKey => {
    const items = places.filter(p => p.cat === catKey);
    if (!items.length) return;
    const title = document.createElement('div');
    title.className = 'section-title';
    title.dataset.section = catKey;
    title.textContent = catLabels[catKey];
    container.appendChild(title);

    items.forEach(p => {
      const mapsUrl = mapsQuery(p.name);
      const card = document.createElement('a');
      card.className = 'card';
      card.href = mapsUrl;
      card.target = '_blank';
      card.rel = 'noopener';
      card.dataset.id = p.id;
      card.dataset.cat = p.cat;
      card.dataset.tablein = p.tablein ? '1' : '0';
      card.innerHTML = `
        <div class="card-head">
          <h3>${p.name}</h3>
          <div class="rating">★ ${p.rating}</div>
        </div>
        <div><span class="cat ${p.cat}">${p.tag}</span><span class="price">${p.price}</span></div>
        <div class="desc">${p.desc}</div>
        ${p.plNote ? `<div class="pl-note">🇵🇱 ${p.plNote}</div>` : ''}
        <div class="map-hint">📍 Kliknij, aby otworzyć w Google Maps</div>
        <div class="actions">
          <span class="btn btn-primary">Google Maps</span>
          ${p.website ? `<a class="btn" href="${p.website}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Strona www</a>` : ''}
          ${p.tablein ? `<a class="btn btn-tablein" href="${p.tablein}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Rezerwacja Tablein</a>` : ''}
        </div>
      `;
      container.appendChild(card);
    });
  });
}

document.getElementById('filters').addEventListener('click', e => {
  if (!e.target.classList.contains('chip')) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  e.target.classList.add('active');
  const cat = e.target.dataset.cat;

  document.querySelectorAll('.card').forEach(card => {
    const show =
      cat === 'all' ||
      (cat === 'tablein' && card.dataset.tablein === '1') ||
      card.dataset.cat === cat;
    card.style.display = show ? '' : 'none';
  });

  document.querySelectorAll('.section-title').forEach(title => {
    const sectionCat = title.dataset.section;
    let show;
    if (cat === 'all') show = true;
    else if (cat === 'tablein') show = !!document.querySelector(`.card[data-cat="${sectionCat}"][data-tablein="1"]`);
    else show = sectionCat === cat;
    title.style.display = show ? '' : 'none';
  });
});

render();
</script>
