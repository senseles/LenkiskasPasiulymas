<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wilno – Przewodnik dla Gości z Polski</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #faf7f2;
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #b8312f;
    --accent-2: #d4a373;
    --accent-3: #2f6b3c;
    --accent-4: #6b4ba0;
    --card: #ffffff;
    --border: #e8e2d5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
  }
  header {
    padding: 32px 24px 16px;
    text-align: center;
    background: linear-gradient(180deg, #fff 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0 0 8px;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 1.05rem;
  }
  .flag { display: inline-block; margin-right: 6px; }
  main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px;
    display: grid;
    grid-template-columns: 1fr 1.2fr;
    gap: 24px;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }
  #map {
    height: 680px;
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 4px 16px rgba(0,0,0,0.04);
    position: sticky;
    top: 16px;
  }
  @media (max-width: 900px) {
    #map { height: 420px; position: static; }
  }
  .list h2 {
    margin: 0 0 12px;
    font-size: 1.3rem;
  }
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  .chip {
    padding: 6px 14px;
    border-radius: 999px;
    background: #fff;
    border: 1px solid var(--border);
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.15s;
    font-family: inherit;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .section-title {
    font-size: 1rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 24px 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .section-title:first-of-type { margin-top: 0; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 12px;
    transition: all 0.2s;
    cursor: pointer;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    border-color: var(--accent-2);
  }
  .card.active {
    border-color: var(--accent);
    box-shadow: 0 8px 20px rgba(184,49,47,0.12);
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 6px;
  }
  .card-head h3 { margin: 0; font-size: 1.1rem; }
  .rating {
    color: var(--accent);
    font-weight: 600;
    font-size: 0.9rem;
    white-space: nowrap;
  }
  .cat {
    display: inline-block;
    font-size: 0.72rem;
    color: #fff;
    padding: 2px 8px;
    border-radius: 4px;
    margin-right: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .cat.restaurant { background: var(--accent-2); }
  .cat.bar { background: var(--accent-4); }
  .cat.sight { background: var(--accent-3); }
  .cat.premium { background: var(--accent); }
  .price {
    display: inline-block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-left: 4px;
  }
  .desc {
    font-size: 0.92rem;
    color: #333;
    margin: 8px 0;
  }
  .addr {
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .pl-note {
    font-size: 0.82rem;
    color: var(--accent);
    background: #fff4f3;
    padding: 6px 10px;
    border-radius: 6px;
    margin-top: 8px;
    border-left: 3px solid var(--accent);
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 6px 12px;
    font-size: 0.82rem;
    border-radius: 6px;
    text-decoration: none;
    border: 1px solid var(--border);
    color: var(--ink);
    background: #fff;
    transition: all 0.15s;
  }
  .btn:hover {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn-primary:hover {
    background: #8f2422;
    border-color: #8f2422;
  }
  .btn-tablein {
    background: #2563eb;
    color: #fff;
    border-color: #2563eb;
  }
  .btn-tablein:hover {
    background: #1d4ed8;
    border-color: #1d4ed8;
  }
  .leaflet-popup-content { margin: 12px 14px; font-size: 0.9rem; }
  .leaflet-popup-content strong { font-size: 1rem; }
  .leaflet-popup-content a { color: var(--accent); text-decoration: none; }
  footer {
    text-align: center;
    padding: 24px;
    color: var(--muted);
    font-size: 0.85rem;
    border-top: 1px solid var(--border);
    margin-top: 24px;
  }
  .legend {
    background: #fff;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 0.8rem;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    line-height: 1.8;
  }
  .legend-dot {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
  }
</style>
</head>
<body>

<header>
  <h1><span class="flag">🇵🇱</span> Witamy w Wilnie!</h1>
  <p>Restauracje, bary i miejsca warte zobaczenia w centrum miasta — z polskimi akcentami i najlepszymi opiniami w Google</p>
</header>

<main>
  <section class="list">
    <h2>Polecane miejsca</h2>
    <div class="filter-bar" id="filters">
      <button class="chip active" data-cat="all">Wszystko</button>
      <button class="chip" data-cat="restaurant">Restauracje</button>
      <button class="chip" data-cat="premium">Premium</button>
      <button class="chip" data-cat="bar">Bary</button>
      <button class="chip" data-cat="sight">Atrakcje</button>
      <button class="chip" data-cat="tablein">Rezerwacja Tablein</button>
    </div>
    <div id="cards"></div>
  </section>

  <div id="map"></div>
</main>

<footer>
  Demo · Centrum Wilna · Ceny i godziny otwarcia mogą się zmieniać · Polecamy rezerwację z wyprzedzeniem
</footer>

const map = L.map('map').setView([54.6810, 25.2870], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '© OpenStreetMap'
}).addTo(map);

const legend = L.control({position: 'bottomright'});
legend.onAdd = function() {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML =
    '<span class="legend-dot" style="background:#d4a373"></span>Restauracja<br>' +
    '<span class="legend-dot" style="background:#b8312f"></span>Premium<br>' +
    '<span class="legend-dot" style="background:#6b4ba0"></span>Bar<br>' +
    '<span class="legend-dot" style="background:#2f6b3c"></span>Atrakcja';
  return div;
};
legend.addTo(map);

const markers = {};
const cards = {};

const catColors = {
  restaurant: '#d4a373',
  premium: '#b8312f',
  bar: '#6b4ba0',
  sight: '#2f6b3c'
};

const catLabels = {
  restaurant: 'Restauracje',
  premium: 'Premium / Fine dining',
  bar: 'Bary i puby',
  sight: 'Atrakcje i miejsca warte odwiedzenia'
};

function makeIcon(color) {
  return L.divIcon({
    className: 'custom-marker',
    html: `<div style="background:${color};width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.3)"></div>`,
    iconSize: [28, 28],
    iconAnchor: [14, 28]
  });
}

function render() {
  const container = document.getElementById('cards');
  container.innerHTML = '';

  const order = ['restaurant', 'premium', 'bar', 'sight'];
  order.forEach(catKey => {
    const items = places.filter(p => p.cat === catKey);
    if (!items.length) return;
    const title = document.createElement('div');
    title.className = 'section-title';
    title.dataset.section = catKey;
    title.textContent = catLabels[catKey];
    container.appendChild(title);

    items.forEach(p => {
      const color = catColors[p.cat];
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = p.id;
      card.dataset.cat = p.cat;
      card.dataset.tablein = p.tablein ? '1' : '0';
      card.innerHTML = `
        <div class="card-head">
          <h3>${p.name}</h3>
          <div class="rating">★ ${p.rating}</div>
        </div>
        <div><span class="cat ${p.cat}">${p.tag}</span><span class="price">${p.price}</span></div>
        <div class="desc">${p.desc}</div>
        <div class="addr">📍 ${p.addr}</div>
        ${p.plNote ? `<div class="pl-note">🇵🇱 ${p.plNote}</div>` : ''}
        <div class="actions">
          <a class="btn btn-primary" href="${p.maps}" target="_blank" rel="noopener">Google Maps</a>
          ${p.website ? `<a class="btn" href="${p.website}" target="_blank" rel="noopener">Strona www</a>` : ''}
          ${p.tablein ? `<a class="btn btn-tablein" href="${p.tablein}" target="_blank" rel="noopener">Rezerwacja Tablein</a>` : ''}
        </div>
      `;
      card.addEventListener('click', e => {
        if (e.target.closest('a')) return;
        map.flyTo(p.coords, 17, { duration: 0.8 });
        markers[p.id].openPopup();
        document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
      });
      container.appendChild(card);
      cards[p.id] = card;

      const marker = L.marker(p.coords, { icon: makeIcon(color) }).addTo(map);
      marker.bindPopup(`
        <strong>${p.name}</strong><br>
        <span style="color:#b8312f">★ ${p.rating}</span> · ${p.tag}<br>
        <span style="font-size:0.85rem;color:#666">${p.addr}</span><br><br>
        <a href="${p.maps}" target="_blank">Otwórz w Google Maps</a>
        ${p.tablein ? `<br><a href="${p.tablein}" target="_blank">Rezerwacja Tablein</a>` : ''}
      `);
      marker.on('click', () => {
        document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
        cards[p.id].classList.add('active');
        cards[p.id].scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
      markers[p.id] = marker;
    });
  });
}

document.getElementById('filters').addEventListener('click', e => {
  if (!e.target.classList.contains('chip')) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  e.target.classList.add('active');
  const cat = e.target.dataset.cat;

  document.querySelectorAll('.card').forEach(card => {
    const show =
      cat === 'all' ||
      (cat === 'tablein' && card.dataset.tablein === '1') ||
      card.dataset.cat === cat;
    card.style.display = show ? '' : 'none';
  });

  document.querySelectorAll('.section-title').forEach(title => {
    const sectionCat = title.dataset.section;
    let show;
    if (cat === 'all') show = true;
    else if (cat === 'tablein') show = !!document.querySelector(`.card[data-cat="${sectionCat}"][data-tablein="1"]`);
    else show = sectionCat === cat;
    title.style.display = show ? '' : 'none';
  });
});

render();
</script>
